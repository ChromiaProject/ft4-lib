blockchains:
  ft3_demo: #Name of the blockchain
    module: main #Entrypoint to the project
    moduleArgs:
      lib.ft3.core:
        rate_limit_active: 1
        rate_limit_max_points: 10
        rate_limit_recovery_time: 5000
        rate_limit_points_at_account_creation: 1

compile:
  source: ../rell/src
  target: ../rell/out