multichain_tests:
  services:
    - docker
  stage: test
  script:
    - ./scripts/install-chr-and-pmc.sh
    - npm ci
    - systemctl start docker
    - chmod +x ./scripts/multichain-jesttest.sh; ./scripts/multichain-jesttest.sh

update_docs:
  stage: deploy
  script:
    - ./scripts/update-docs.sh

