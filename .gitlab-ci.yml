multichain_tests:
  stage: test
  script:
    - ./scripts/install-chr-and-pmc.sh
    - npm ci
    - bash scripts/multichain-jesttest.sh

update_docs:
  stage: deploy
  script:
    - ./scripts/update-docs.sh

