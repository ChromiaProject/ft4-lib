workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - "*"
      when: always
    - if: $CI_COMMIT_BRANCH == "development"
      changes:
        - "*"
      when: always
    - if: $CI_COMMIT_BRANCH == "ft4"
      changes:
        - "*"
      when: always
