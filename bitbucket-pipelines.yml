image: registry.gitlab.com/chromaway/core-tools/chromia-images/node21-java21:1.0.0

options:
  max-time: 15


e2e-tests: &e2e-tests-anchor
    max-time: 15
    name: E2E Tests
    image: cypress/browsers:node-20.11.0-chrome-121.0.6167.85-1-ff-120.0-edge-121.0.2277.83-1
    size: 2x
    caches:
      - node
      - demo-node
      - cypress
    script:
      - apt update
      - apt install -y gnupg software-properties-common lsof fluxbox xvfb netcat-openbsd java-common
      - wget -nv https://corretto.aws/downloads/resources/21.0.2.13.1/java-21-amazon-corretto-jdk_21.0.2.13-1_amd64.deb
      - dpkg --install java-21-amazon-corretto-jdk_21.0.2.13-1_amd64.deb
      - java -version

      - ./install-chr-and-pmc.sh

      - export DISPLAY=:0.0
      - Xvfb :0 -screen 0 1024x768x24 -listen tcp -ac &
      - fluxbox &
      - npm ci
      - npm run test:e2e || (curl -X POST https://chromadev.zulipchat.com/api/v1/messages -u ${BUILD_BOT_EMAIL_ADDRESS}:${BUILD_BOT_API_KEY} --data-urlencode type=stream --data-urlencode 'to="Protocols - FT4 builds"' --data-urlencode 'topic=Build failed' --data-urlencode "content=E2E tests failed on [Bitbucket](https://bitbucket.org/chromawallet/ft3-lib/pipelines/results/${BITBUCKET_BUILD_NUMBER})." ; exit 1)
    artifacts:
      - logs/**
      - cypress/screenshots/**
      - cypress/videos/**
    services:
      - docker

pipelines:
  pull-requests:
    '**':
      - step:
          <<: *e2e-tests-anchor
#          trigger: manual
  branches:
    ft4:
      - step:
          name: deploy:latest
          script:
            - ./install-chr-and-pmc.sh
            - chr install -s configs/jest-test.yml
            - mkdir .chromia
            - printf $DEPLOYMENT_KEYS > .chromia/config
            - npm run deploy:latest
            - rm .chromia/config
    development:
      - step: *e2e-tests-anchor
  custom:
    deploy-to-stable:
      - step:
          name: deploy:stable
          script:
            - ./install-chr-and-pmc.sh
            - chr install -s configs/jest-test.yml
            - mkdir .chromia
            - printf $DEPLOYMENT_KEYS > .chromia/config
            - npm run deploy:stable
            - rm .chromia/config
    deploy-to-latest:
      - step:
          name: deploy:latest
          script:
            - ./install-chr-and-pmc.sh
            - chr install -s configs/jest-test.yml
            - mkdir .chromia
            - printf $DEPLOYMENT_KEYS > .chromia/config
            - npm run deploy:latest
            - rm .chromia/config
definitions:
  caches:
    demo-node: examples/demo/client/node_modules
    cypress: $BITBUCKET_CLONE_DIR/.cache/Cypress
  services: 
    postgres: 
      image: postgres 
      variables: 
        POSTGRES_DB: 'postchain' 
        POSTGRES_USER: 'postchain'
        POSTGRES_PASSWORD: 'postchain'
        POSTGRES_INITDB_ARGS: '--lc-collate=C.UTF-8 --lc-ctype=C.UTF-8 --encoding=UTF-8'
