image: registry.gitlab.com/chromaway/core-tools/chromia-images/node21-java21:1.2.0@sha256:c04590bf5702e3e3071ac3bae28ad4e1129ac7239e1bfd655451f718807ca1fd

options:
  max-time: 15

unit-integration-tests: &unit-integration-tests-anchor
  size: 2x
  name: Unit & Integration Tests
  caches:
    - node
  script:
    - ./scripts/install-chr-and-pmc.sh
    - chr install
    - chr build
    - chr test --use-db --test-report --test-report-dir=test-reports/rell || (curl --no-progress-meter -X POST https://chromadev.zulipchat.com/api/v1/messages -u ${BUILD_BOT_EMAIL_ADDRESS}:${BUILD_BOT_API_KEY} --data-urlencode type=stream --data-urlencode 'to="Protocols - FT4 builds"' --data-urlencode 'topic=Build failed' --data-urlencode "content=Rell tests failed on [Bitbucket](https://bitbucket.org/chromawallet/ft3-lib/pipelines/results/${BITBUCKET_BUILD_NUMBER})." ; exit 1)
    - npm ci
    - npm run compile
    - npm run generate:docs
    - export JEST_JUNIT_OUTPUT_NAME=unit.xml
    - npx jest -maxWorkers=1 --testPathPattern=unit/ --ci --reporters=default --reporters=jest-junit || (curl --no-progress-meter -X POST https://chromadev.zulipchat.com/api/v1/messages -u ${BUILD_BOT_EMAIL_ADDRESS}:${BUILD_BOT_API_KEY} --data-urlencode type=stream --data-urlencode 'to="Protocols - FT4 builds"' --data-urlencode 'topic=Build failed' --data-urlencode "content=TS unit tests failed on [Bitbucket](https://bitbucket.org/chromawallet/ft3-lib/pipelines/results/${BITBUCKET_BUILD_NUMBER})." ; exit 1)
    - export TESTCONTAINERS_RYUK_DISABLED=true
    - export JEST_JUNIT_OUTPUT_NAME=integration.xml
    - npx jest --config=jest.config.integration.js -maxWorkers=1 --testPathPattern=integration/ --ci --reporters=default --reporters=jest-junit || (curl --no-progress-meter -X POST https://chromadev.zulipchat.com/api/v1/messages -u ${BUILD_BOT_EMAIL_ADDRESS}:${BUILD_BOT_API_KEY} --data-urlencode type=stream --data-urlencode 'to="Protocols - FT4 builds"' --data-urlencode 'topic=Build failed' --data-urlencode "content=TS integration tests failed on [Bitbucket](https://bitbucket.org/chromawallet/ft3-lib/pipelines/results/${BITBUCKET_BUILD_NUMBER})." ; exit 1)
  artifacts:
    - logs/**
  services:
    - postgres
    - docker

e2e-tests: &e2e-tests-anchor
    max-time: 15
    name: E2E Tests
    image: cypress/browsers:node-20.11.0-chrome-121.0.6167.85-1-ff-120.0-edge-121.0.2277.83-1
    size: 2x
    caches:
      - node
      - demo-node
      - cypress
    script:
      - apt update
      - apt install -y gnupg software-properties-common lsof fluxbox xvfb netcat-openbsd java-common curl
      - wget -nv -O - https://corretto.aws/downloads/resources/21.0.2.13.1/amazon-corretto-21.0.2.13.1-linux-x64.tar.gz | tar -C /opt -xz
      - ln -s /opt/amazon-corretto-21.0.2.13.1-linux-x64/bin/java /usr/bin/java
      - java -version

      - ./scripts/install-chr-and-pmc.sh

      - export DISPLAY=:0.0
      - Xvfb :0 -screen 0 1024x768x24 -listen tcp -ac &
      - fluxbox &
      - npm ci
      - npm run test:e2e || (curl --no-progress-meter -X POST https://chromadev.zulipchat.com/api/v1/messages -u ${BUILD_BOT_EMAIL_ADDRESS}:${BUILD_BOT_API_KEY} --data-urlencode type=stream --data-urlencode 'to="Protocols - FT4 builds"' --data-urlencode 'topic=Build failed' --data-urlencode "content=E2E tests failed on [Bitbucket](https://bitbucket.org/chromawallet/ft3-lib/pipelines/results/${BITBUCKET_BUILD_NUMBER})." ; exit 1)
    artifacts:
      - logs/**
      - cypress/screenshots/**
      - cypress/videos/**
    services:
      - docker

multichain-tests: &multichain-tests-anchor
  max-time: 30
  size: 2x
  name: Multichain tests
  caches:
    - node
  services:
    - docker
  script:
    - ./scripts/install-chr-and-pmc.sh
    - npm ci
    - bash scripts/multichain-jesttest.sh

update-docs: &update-docs-anchor
  max-time: 15
  name: Update docs
  services:
    - docker
  script: 
    - |
      export DOCKER_BUILDKIT=1
      GIT_EMAIL=`git config user.email`
      GIT_NAME=`git config user.name`
      git clone https://x-token-auth:$DOCS_REPO_API_TOKEN@bitbucket.org/chromawallet/chromia-docs.git docs-repo
      
      ./scripts/install-chr-and-pmc.sh
      npm ci
      npx typedoc --out docs-repo/static/pages/ft4-ts-client/client
      chr install
      chr build
      chr generate docs-site --target docs-repo/static/pages/ft4-rell

      VERSION=`npm pkg get version | tr -d '"'`
      cd docs-repo

      # Check if there are changes 
      if [ `git status --porcelain | wc -l` -gt 0 ]; then
        # Commit and push the changes
        BRANCH=ft4-version-$VERSION

        git config user.email $GIT_EMAIL
        git config user.name $GIT_NAME

        git checkout -b $BRANCH
        git add .
        git commit -m "Update ft4 api docs to version $VERSION"
        
        echo "Pushing the changes to remote"
        git push origin $BRANCH
        echo "Successfully pushed changes to remote"

        echo "Opening a PR in docs repo"
        HTTP_STATUS=$(curl -v \
            --header 'Authorization: Bearer '"$DOCS_REPO_API_TOKEN" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data '{
              "title": "BUILD_USER: Update ft4 api docs to version '"$VERSION"'",
              "source": {"branch": {"name": "'"$BRANCH"'"}},
              "destination": {"branch": {"name": "master"}},
              "close_source_branch": true
            }' \
            --write-out '%{http_code}' \
            --output response.txt \
            "https://api.bitbucket.org/2.0/repositories/chromawallet/chromia-docs/pullrequests")
        
        if [ "$HTTP_STATUS" -ge 299 ]; then
          echo "Failed to open PR with status <"$HTTP_STATUS"> and message:"
          cat response.txt
          exit 1
        fi
      else
        echo "No changes to commit."
      fi

pipelines:
  pull-requests:
    '**':
      - parallel:
        - step: *unit-integration-tests-anchor
        - step: *multichain-tests-anchor
      - step:
          <<: *e2e-tests-anchor
          trigger: manual
  branches:
    ft4:
      - step:
          name: deploy:latest
          script:
            - ./scripts/install-chr-and-pmc.sh
            - chr install
            - mkdir .chromia
            - printf $DEPLOYMENT_KEYS > .chromia/config
            - npm run deploy:latest
            - rm .chromia/config
    development:
      - parallel:
        - step: *unit-integration-tests-anchor
        - step: *multichain-tests-anchor
        - step:
            <<: *e2e-tests-anchor
            trigger: manual
    master:
      - step: *update-docs-anchor
          
  custom:
    deploy-to-stable:
      - step:
          name: deploy:stable
          script:
            - ./scripts/install-chr-and-pmc.sh
            - chr install
            - mkdir .chromia
            - printf $DEPLOYMENT_KEYS > .chromia/config
            - npm run deploy:stable
            - rm .chromia/config
    deploy-to-latest:
      - step:
          name: deploy:latest
          script:
            - ./scripts/install-chr-and-pmc.sh
            - chr install
            - mkdir .chromia
            - printf $DEPLOYMENT_KEYS > .chromia/config
            - npm run deploy:latest
            - rm .chromia/config
    Multichain tests:
      - step: *multichain-tests-anchor
definitions:
  caches:
    demo-node: examples/demo/client/node_modules
    cypress: $BITBUCKET_CLONE_DIR/.cache/Cypress
  services: 
    postgres: 
      image: postgres 
      variables: 
        POSTGRES_DB: 'postchain' 
        POSTGRES_USER: 'postchain'
        POSTGRES_PASSWORD: 'postchain'
        POSTGRES_INITDB_ARGS: '--lc-collate=C.UTF-8 --lc-ctype=C.UTF-8 --encoding=UTF-8'
