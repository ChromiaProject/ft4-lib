image: node:10.15.3

pipelines:
  branches:
    development:
      - step:
          name: Build
          caches:
            - node
          script:
            - apt-get update
            - apt-get install -y zip
            - cp -r postchain app/
            - cp -r rell app/
            - cd app && zip -r ../ft3.zip *
            - cd ..
          artifacts:
            - ft3.zip
      - step:
          name: Upload artifact to S3
          services:
            - docker
          scripts:
            - pipe: atlassian/aws-code-deploy:0.2.7
              variables:
                AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                COMMAND: 'upload'
                APPLICATION_NAME: $APPLICATION_NAME
                ZIP_FILE: 'ft3.zip'
                S3_BUCKET: $S3_BUCKET
      - step:
          name: Deploy with CodeDeploy
          services:
            - docker
          script:
            - pipe: atlassian/aws-code-deploy:0.2.7
              variables:
                AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                COMMAND: 'deploy'
                APPLICATION_NAME: $APPLICATION_NAME
                DEPLOYMENT_GROUP: $DEPLOYMENT_GROUP
                WAIT: 'true'
                S3_BUCKET: $S3_BUCKET
