image: node:18

options:
  max-time: 15

pipelines:
  pull-requests:
    '**':
      - step:
          size: 2x
          name: Test
          caches:
            - node
          script:
            - apt update
            - curl -fsSL https://apt.chromia.com/chromia.gpg >/usr/share/keyrings/chromia.gpg
            - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/chromia.gpg] https://apt.chromia.com stable main" >/etc/apt/sources.list.d/chromia.list
            - apt update
            - apt install -y netcat-openbsd chr default-jre
            - chr install -s configs/rell-test.yml
            - chr test -s configs/rell-test.yml --use-db --test-report --test-report-dir=test-reports/rell
            - npm ci
            - export JEST_JUNIT_OUTPUT_NAME=unit.xml
            - npx jest -maxWorkers=1 --testPathPattern=unit/ --ci --reporters=default --reporters=jest-junit
            - export TESTCONTAINERS_RYUK_DISABLED=true
            - export JEST_JUNIT_OUTPUT_NAME=integration.xml
            - npx jest --config=jest.config.integration.js -maxWorkers=1 --testPathPattern=integration/ --ci --reporters=default --reporters=jest-junit
          services:
            - postgres
            - docker
      - step:
          name: E2E Tests
          image: cypress/browsers:node18.16.0-chrome101-ff99
          size: 2x
          caches:
            - node
            - cypress
          script:
            - npm ci
            - npm run test:e2e:headless
          artifacts:
            - cypress/screenshots/**
            - cypress/videos/**
  branches:
    ft4:
      - step:
          name: deploy:latest
          script:
            - apt update
            - curl -fsSL https://apt.chromia.com/chromia.gpg >/usr/share/keyrings/chromia.gpg
            - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/chromia.gpg] https://apt.chromia.com stable main" >/etc/apt/sources.list.d/chromia.list
            - apt update
            - apt install default-jre -y
            - apt install chr
            - chr install -s configs/jest-test.yml
            - mkdir .chromia
            - printf $DEPLOYMENT_KEYS > .chromia/config
            - npm run deploy:latest
            - rm .chromia/config
  custom:
    deploy-to-stable:
      - step:
          name: deploy:stable
          script:
            - apt update
            - curl -fsSL https://apt.chromia.com/chromia.gpg >/usr/share/keyrings/chromia.gpg
            - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/chromia.gpg] https://apt.chromia.com stable main" >/etc/apt/sources.list.d/chromia.list
            - apt update
            - apt install default-jre -y
            - apt install chr
            - chr install -s configs/jest-test.yml
            - mkdir .chromia
            - printf $DEPLOYMENT_KEYS > .chromia/config
            - npm run deploy:stable
            - rm .chromia/config
    deploy-to-latest:
      - step:
          name: deploy:latest
          script:
            - apt update
            - curl -fsSL https://apt.chromia.com/chromia.gpg >/usr/share/keyrings/chromia.gpg
            - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/chromia.gpg] https://apt.chromia.com stable main" >/etc/apt/sources.list.d/chromia.list
            - apt update
            - apt install default-jre -y
            - apt install chr
            - chr install -s configs/jest-test.yml
            - mkdir .chromia
            - printf $DEPLOYMENT_KEYS > .chromia/config
            - npm run deploy:latest
            - rm .chromia/config
    ft4-201-e2e-pipeline:
      - step:
          name: E2E Tests
          image: cypress/browsers:node18.16.0-chrome101-ff99
          size: 2x
          caches:
            - node
            - cypress
          script:
            - npm ci
            - npm run test:e2e:headless
          artifacts:
            - cypress/screenshots/**
            - cypress/videos/**
    development:
      - step:
          name: E2E Tests
          image: cypress/browsers:node18.16.0-chrome101-ff99
          size: 2x
          caches:
            - node
            - cypress
          script:
            - npm ci
            - npm run test:e2e:headless
          artifacts:
            - cypress/screenshots/**
            - cypress/videos/**
definitions: 
  services: 
    postgres: 
      image: postgres 
      variables: 
        POSTGRES_DB: 'postchain' 
        POSTGRES_USER: 'postchain'
        POSTGRES_PASSWORD: 'postchain'
        POSTGRES_INITDB_ARGS: '--lc-collate=C.UTF-8 --lc-ctype=C.UTF-8 --encoding=UTF-8'
